# Decap CMS 配置
# 登录授权中转服务（base_url）部署完成后会填入真实地址
backend:
  name: github
  repo: pulost/fengblog
  branch: main
  base_url: https://fengblog-auth.pulost.workers.dev
  auth_endpoint: /auth

locale: zh_Hans

media_folder: static/images/uploads
public_folder: /images/uploads

collections:
  - name: posts
    label: 文章
    folder: content/posts
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "标题", name: title, widget: string }
      - { label: "发布日期", name: date, widget: datetime }
      - { label: "草稿", name: draft, widget: boolean, default: false, required: false }
      - { label: "标签", name: tags, widget: list, required: false }
      - { label: "分类", name: categories, widget: list, required: false }
      - { label: "正文", name: body, widget: markdown }
