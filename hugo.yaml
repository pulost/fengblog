baseURL: https://fengblog.pages.dev/
languageCode: zh-cn
defaultContentLanguage: zh-cn
title: 我的博客
theme: PaperMod

enableRobotsTXT: true

params:
  description: 记录生活与思考
  author: 博主
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  comments: false
  hideFooter: false
  socialIcons:
    - name: github
      url: https://github.com/
    - name: rss
      url: index.xml

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 1
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 2
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 3
    - identifier: about
      name: 关于
      url: /about/
      weight: 4

outputs:
  home:
    - HTML
    - RSS
    - JSON

paginate: 5
